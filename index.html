<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="Minjun Kim — I explore audical noises.">
    <title>Minjun Kim — About</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="assets/fonts/SpaceGrotesk.ttf" as="font" type="font/ttf" crossorigin>
    <script>
      // Apply the saved theme before the stylesheet loads.
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('xoymoron-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          // Storage may be unavailable in private browsing.
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#090909' : '#efeee8';
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260929b">
    <script type="module" src="app.js?v=20260929b"></script>
    <script type="module" src="glitch.js?v=20260929b"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="glitch-field" aria-hidden="true" style="position:fixed;inset:0;overflow:hidden;pointer-events:none">
      <div class="glitch-mark">
        <div class="mark-base"></div>
        <div class="mark-slice mark-slice-a"></div>
        <div class="mark-slice mark-slice-b"></div>
      </div>
      <div class="diagram-mark">
        <div class="diagram-base"></div>
        <div class="diagram-slice diagram-slice-a"></div>
        <div class="diagram-slice diagram-slice-b"></div>
      </div>
      <canvas class="glitch-pixels" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
    </div>
    <div class="site-shell">
      <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#about" aria-current="page">About</a>
          <a href="#experiences">Experiences</a>
          <a href="#publications">Publications</a>
          <!-- <a href="#works">Works</a> -->
          <a href="#cv">CV</a>
          <!-- <a href="#blog">Blog</a> -->
          <!-- <a href="#contact">Contact</a> -->
        </nav>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/>
          </svg>
          <span class="theme-label">Dark</span>
        </button>
      </header>

      <!-- app.js switches pages and fills lists from content.js. -->
      <main id="main" tabindex="-1">
        <section class="page about-page" id="about" aria-labelledby="about-title">
          <div class="about-layout">
            <div class="about-copy">
              <h1 id="about-title" class="name-title" data-profile="name"></h1>
              <p class="name-position" data-profile="position" hidden></p>
              <hr class="about-divider" hidden>
              <div class="about-introduction" data-profile="bio"></div>
            </div>
          </div>

          <section class="about-section" aria-labelledby="news-title">
            <h2 id="news-title">News</h2>
            <ul class="news-list"></ul>
          </section>

          <!-- Selected Publications: leave commented out until ready.
          <section class="about-section" aria-labelledby="selected-publications-title">
            <h2 id="selected-publications-title">Selected Publications</h2>
            <div class="selected-publication-list">
              <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>
          </section>
          -->
        </section>

        <section class="page" id="experiences" aria-label="Experiences" hidden>
          <div class="entry-list" id="experience-list">
            <div class="empty-state">
              <span class="empty-symbol" aria-hidden="true">—</span>
              <p>No experiences listed yet.</p>
            </div>
          </div>
        </section>

        <section class="page" id="publications" aria-label="Publications" hidden>
          <div class="publication-groups" id="publication-list">
            <div class="empty-state">
              <span class="empty-symbol" aria-hidden="true">—</span>
              <p>No publications listed yet.</p>
            </div>
          </div>
        </section>

        <!-- Works page disabled
        <section class="page" id="works" aria-label="Works" hidden>
          <div class="entry-list" id="work-list">
            <div class="empty-state">
              <span class="empty-symbol" aria-hidden="true">—</span>
              <p>No works added yet.</p>
            </div>
          </div>
        </section>
        -->

        <section class="page" id="cv" aria-label="Curriculum Vitae" hidden>
          <div id="cv-content">
            <div class="document-placeholder">
              <div>
                <h2>CV</h2>
                <p>The document will be available here.</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Blog page disabled
        <section class="page" id="blog" aria-label="Blog" hidden>
          <div id="blog-index">
            <div class="entry-list" id="post-list">
              <div class="empty-state">
                <span class="empty-symbol" aria-hidden="true">—</span>
                <p>No posts published yet.</p>
              </div>
            </div>
          </div>
          <article id="blog-article" class="blog-article" hidden></article>
        </section>
        -->

        <!-- Studio: Hidden tab for editing News, Blog and portfolio content -->
        <section class="page studio-page" id="studio" aria-label="Studio" hidden>
        </section>

        <!-- Contact page disabled (contact links available in footer)
        <section class="page" id="contact" aria-label="Contact" hidden>
          <div class="contact-list" id="contact-list"></div>
        </section>
        -->
      </main>

      <!-- Footer icons use explicit links; also update profile.links when needed. -->

        <div class="social-links" aria-label="Social profiles">
          <a class="social-link" href="mailto:oxymoron@yonsei.ac.kr" aria-label="Email oxymoron@yonsei.ac.kr" title="oxymoron@yonsei.ac.kr">

            </svg>

            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.694 2 2 2.677 2 3.512v16.976C2 21.323 2.694 22 3.55 22h16.9c.856 0 1.55-.677 1.55-1.512V3.512C22 2.677 21.306 2 20.45 2ZM7.93 18.745H4.96V9.2h2.97v9.545ZM6.446 7.895a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44ZM19.045 18.745h-2.96v-4.64c0-1.106-.021-2.529-1.541-2.529-1.543 0-1.78 1.206-1.78 2.448v4.721h-2.963V9.2h2.844v1.305h.04c.395-.75 1.363-1.54 2.8-1.54 2.993 0 3.56 1.97 3.56 4.533v5.247Z"/>

          <a class="social-link" href="https://scholar.google.com/citations?user=AoXUJy4AAAAJ" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar">

          </a>
        </div>
      </footer>
    </div>
    <noscript>
      <style>
        .page[hidden] { display: block !important; }
        .theme-toggle { display: none; }

      <p class="noscript-note">JavaScript enables content lists, page switching, and the theme toggle. Without it, only the HTML fallback is shown.</p>

  </body>
</html>
